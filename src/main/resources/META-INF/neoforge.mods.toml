side = "BOTH"
[[dependencies.eidolon_repraised]]
modId = "curios"
mandatory = true
versionRange = "[1.19-5.0.7.1,)"
ordering = "AFTER"
side = "BOTH"

# apotheosis dependency
[[dependencies.eidolon_repraised]]
modId = "apotheosis"
mandatory = false
versionRange = "[1.20.1-7.1,)"
ordering = "AFTER"
side = "BOTH"
type = "optional"
reason = "integration"

[[mixins]]
config = "eidolon_repraised.mixins.json"
