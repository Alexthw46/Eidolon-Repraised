modLoader = "javafml" #mandatory
loaderVersion = "[4,)" #mandatory This is typically bumped every Minecraft version by Forge. See our download page for lists of versions.
license = "All rights reserved"
issueTrackerURL = "https://github.com/Alexthw46/Eidolon-Repraised/issues" #optional
[[mods]] #mandatory
modId = "eidolon_repraised" #mandatory
version = "${file.jarVersion}" #mandatory
displayName = "Eidolon:Repraised" #mandatory
# updateJSONURL="http://myurl.me/" #optional
# displayURL="http://example.com/" #optional
logoFile = "logo.png" #optional
credits = "elucent as the original creator of Eidolon and maker of most of the assets, porting and features from 1.18 onward to Alexthw" #optional
authors = "elucent up to 0.3.0, currently maintained by Alexthw" #optional
description = '''
A spooky magic mod about necromancy. Now with a touch of opposing light!
'''
[[dependencies.eidolon_repraised]]
modId = "minecraft"
mandatory = true
versionRange = "[1.21.1, 1.21.2)" #mandatory
